# One-off: dumps the 26.3 class signatures and sources the mod depends on, as a short-lived artifact.
name: api-probe
on:
  push:
    paths: ['.github/probe-classes.txt', '.github/workflows/probe.yml']
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and decompile Minecraft
        run: |
          chmod +x gradlew
          ./gradlew build genSources --no-daemon 2>&1 | tail -40
      - name: Dump signatures and sources
        run: |
          mkdir -p probe/src
          find ~/.gradle .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -v sources > probe/jars.txt || true
          MCJAR=""
          for j in $(cat probe/jars.txt); do
            if unzip -l "$j" 2>/dev/null | grep -q 'net/minecraft/client/sounds/SoundManager.class'; then MCJAR="$j"; break; fi
          done
          echo "MCJAR=$MCJAR" | tee probe/mcjar.txt
          SRCJAR=$(find ~/.gradle .gradle -name '*sources.jar' 2>/dev/null | while read s; do unzip -l "$s" 2>/dev/null | grep -q 'net/minecraft/client/sounds/SoundManager.java' && echo "$s" && break; done)
          echo "SRCJAR=$SRCJAR" | tee -a probe/mcjar.txt
          while read c; do
            [ -z "$c" ] && continue
            name=$(echo "$c" | tr '/$' '._')
            javap -p -cp "$MCJAR" "$(echo $c | tr / .)" > "probe/$name.javap.txt" 2>&1 || true
            outer=$(echo "$c" | cut -d'$' -f1)
            [ -n "$SRCJAR" ] && unzip -p "$SRCJAR" "$outer.java" > "probe/src/$(echo $outer | tr / .).java" 2>/dev/null || true
          done < .github/probe-classes.txt
          find ~/.gradle -name '*.jar' | grep -E 'lwjgl|jorbis|tinyfd|sdl' | sort -u > probe/lwjgl-jars.txt
          find ~/.gradle -name 'fabric-*.jar' | sed 's#.*/##' | sort -u > probe/fabric-modules.txt
          unzip -l "$MCJAR" | grep -E 'net/minecraft/client/gui/components/[A-Za-z]+\.class' | awk '{print $4}' > probe/gui-components.txt || true
          unzip -l "$MCJAR" | grep -E 'net/minecraft/client/sounds/' | awk '{print $4}' > probe/sounds-classes.txt || true
          ls probe | head -100
      - uses: actions/upload-artifact@v4
        with:
          name: probe
          path: probe/
          retention-days: 1
