plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "SoundChanger"
}

repositories {
	maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu (optional settings button)
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// MP3 (JLayer) and FLAC (jFLAC) decoders, shipped inside the mod jar. Both LGPL, kept as separate jars.
	implementation("javazoom:jlayer:${project.jlayer_version}") { transitive = false }
	include("javazoom:jlayer:${project.jlayer_version}") { transitive = false }
	implementation("org.jflac:jflac-codec:${project.jflac_version}") { transitive = false }
	include("org.jflac:jflac-codec:${project.jflac_version}") { transitive = false }

	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_SoundChanger" }
	}
}

// ./gradlew runClientGameTest starts the game, builds a test pack, checks the decoders and screenshots the editor
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "soundchanger-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
